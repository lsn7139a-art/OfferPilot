name: 晚间学习提醒

on:
  schedule:
    # 北京时间每天21:00（UTC 13:00）
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  evening-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 配置飞书应用
        env:
          FEISHU_CONFIG: ${{ secrets.FEISHU_CONFIG }}
        run: |
          echo "$FEISHU_CONFIG" > config.json

      - name: 发送晚间提醒
        run: python scripts/feishu_push.py --mode evening
