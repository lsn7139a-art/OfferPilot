name: 每日面试题推送

on:
  schedule:
    # 早间推送：北京时间8:00/8:15/8:30/8:45/9:00 多次触发，防重复逻辑保证只执行一次
    - cron: '0 0 * * *'    # 北京时间8:00
    - cron: '15 0 * * *'   # 北京时间8:15
    - cron: '30 0 * * *'   # 北京时间8:30
    - cron: '45 0 * * *'   # 北京时间8:45
    - cron: '0 1 * * *'    # 北京时间9:00
    # 晚间提醒：北京时间20:00/20:30/21:00 多次触发
    - cron: '0 12 * * *'   # 北京时间20:00
    - cron: '30 12 * * *'  # 北京时间20:30
    - cron: '0 13 * * *'   # 北京时间21:00
  workflow_dispatch:

jobs:
  daily-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许git push回写进度文件
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout代码
        uses: actions/checkout@v5

      - name: 设置Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 确保data目录存在
        run: mkdir -p data

      - name: 配置飞书应用
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          FEISHU_USER_OPEN_ID: ${{ secrets.FEISHU_USER_OPEN_ID }}
        run: |
          python -c "
          import json, os, sys
          required = ['FEISHU_APP_ID', 'FEISHU_APP_SECRET', 'FEISHU_CHAT_ID', 'FEISHU_USER_OPEN_ID']
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              print('❌ 缺少以下GitHub Secret，请在仓库 Settings → Secrets and variables → Actions 中配置：')
              for k in missing:
                  print(f'   - {k}')
              sys.exit(1)
          config = {
            'project_name': 'interview-prep-system',
            'version': '1.0.0',
            'data_dir': 'data',
            'questions_file': 'data/questions.json',
            'companies_file': 'data/companies.json',
            'progress_file': 'data/progress.json',
            'daily_log_file': 'data/daily_log.json',
            'feishu': {
              'enabled': True,
              'app_id': os.environ['FEISHU_APP_ID'],
              'app_secret': os.environ['FEISHU_APP_SECRET'],
              'chat_id': os.environ['FEISHU_CHAT_ID'],
              'chat_name': 'lsn',
              'user_open_id': os.environ['FEISHU_USER_OPEN_ID'],
              'daily_push_time': '09:00',
              'evening_reminder_time': '21:00',
              'message_template': 'daily'
            },
            'schedule': {
              'daily_push_cron': '0 9 * * *',
              'evening_reminder_cron': '0 21 * * *',
              'weekly_update_cron': '0 10 * * 0',
              'monthly_review_cron': '0 10 1 * *'
            },
            'question_selection': {
              'daily_count': 3,
              'strategy': 'adaptive',
              'rotation_categories': ['算法', '操作系统', '计算机网络', '数据库', 'C++', 'Java', '系统设计', '具身智能', 'AI大模型'],
              'review_interval_days': [1, 3, 7, 14, 30],
              'weak_area_boost': 1.5
            }
          }
          with open('config.json', 'w', encoding='utf-8') as f:
            json.dump(config, f, ensure_ascii=False, indent=2)
          print('✅ config.json 写入成功')
          "

      - name: 初始化进度文件（如不存在）
        run: |
          if [ ! -f data/progress.json ]; then
            echo '{"completed":[],"skipped":[],"in_progress":[],"streak":0,"total_questions":92,"recent_positions":[],"weak_areas":[],"preferences":{"target_companies":[],"difficulty_weight":{"easy":0.3,"medium":0.5,"hard":0.2}}}' > data/progress.json
            echo 'progress.json 已初始化'
          fi
          if [ ! -f data/daily_log.json ]; then
            echo '[]' > data/daily_log.json
            echo 'daily_log.json 已初始化'
          fi

      - name: 执行推送（代码内判断时间窗口+防重复）
        run: python scripts/feishu_push.py --mode auto

      - name: 提交进度文件回仓库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/progress.json data/daily_log.json data/last_daily_message.txt data/reminder_state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: 更新学习进度 [$(date '+%Y-%m-%d %H:%M')]"
          git push
