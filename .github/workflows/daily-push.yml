name: 每日面试题推送

on:
  schedule:
    # 北京时间每天9:00（UTC 1:00）
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  daily-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 配置飞书应用
        env:
          FEISHU_CONFIG: ${{ secrets.FEISHU_CONFIG }}
        run: |
          echo "$FEISHU_CONFIG" > config.json

      - name: 运行每日推送（群消息+飞书待办）
        run: python scripts/feishu_push.py --mode daily
